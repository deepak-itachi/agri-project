# ---- Server ----
# Cloud Run injects PORT env var; default to 8080 for local dev
server.port=${PORT:8080}

# ---- Database (PostgreSQL). Azure: jdbc:postgresql://<server>.postgres.database.azure.com:5432/agridb?sslmode=require ----
# Locally: point at a local PostgreSQL instance.
# On Cloud Run: use the Cloud SQL Auth Proxy socket format, e.g.
#   jdbc:postgresql:///agridb?cloudSqlInstance=PROJECT:REGION:INSTANCE&socketFactory=com.google.cloud.sql.postgres.SocketFactory
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agridb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- External API keys (set as env vars / Cloud Run secrets, never commit real keys) ----
external.openweather.apikey=${OPENWEATHER_API_KEY:}
external.datagovin.apikey=${DATAGOVIN_API_KEY:}

# ---- Internal SOAP service URI (self-referencing) ----
soap.farmer-requirement.uri=${SOAP_URI:http://localhost:8080/ws}

# ---- Uploaded file storage (soil test reports, land photos) ----
# Local disk for demo/small deployments. Point this at a mounted volume on
# Cloud Run, or swap FarmDataController's saveFile() to write to a Cloud
# Storage bucket for real production scale.
file.upload-dir=${FILE_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# ---- Payment gateway (Razorpay - UPI incl. GPay/PhonePe, cards, netbanking) ----
# Get free test-mode keys at https://dashboard.razorpay.com (no KYC needed to test)
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# ---- Login security (JWT) ----
# Set JWT_SECRET to a long random string (32+ characters) so sign-ins survive server restarts.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiry-hours=${JWT_EXPIRY_HOURS:12}

# ---- First admin account (created automatically if no admin exists) ----
# CHANGE THE PASSWORD before putting the site online.
app.admin.email=${ADMIN_EMAIL:admin@agrisetu.in}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

# ---- Demo data: sample seller/buyer/learner accounts and products. Set SEED_DEMO=false on a public site. ----
app.seed-demo=${SEED_DEMO:true}

# ---- Hosting ----
# Frontend address(es) allowed to call this API, comma separated. "*" = any (fine for local development only).
app.cors-origins=${CORS_ORIGINS:*}
